# THROWAWAY. Step 0 of docs/superpowers/specs/2026-11-06-ci-test-gate-design.md.
# It answers the spike questions S1 to S8 except the concurrency half of S6.
# It is deleted once the spike record exists. It runs only on pushes to ci/**
# branches. The Environment holds the license and waits for the maintainer to
# approve each run. Read the full diff, including scripts/, before approving.
name: CI Spike

on:
  push:
    branches:
      - "ci/**"

# No token scope by default. Each job asks for what it needs.
permissions: {}

# No cache restore and no cache save for any job in this workflow.
cache-mode: none

concurrency:
  group: ci-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: windows-2022
    timeout-minutes: 300
    environment: unity-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: S1 install Unity
        timeout-minutes: 45
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase InstallUnity

      - name: S8 install vendor packages
        timeout-minutes: 30
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase InstallPackages

      # Only this step sees the secret.
      - name: S2 place license
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: ./scripts/ci/spike.ps1 -Phase PlaceLicense

      - name: S3 S4 S5 probe the graphics device
        id: probe
        timeout-minutes: 120
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase Probe

      - name: S4 capture tests on the product assembly
        id: capture
        timeout-minutes: 60
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase ProductCaptureTests

      - name: S5 shader frontend tests on the product assembly
        id: shaders
        timeout-minutes: 90
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase ProductShaderTests

      - name: S7 research assembly
        id: research
        timeout-minutes: 60
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase ResearchTests

      - name: Remove license
        if: always()
        shell: pwsh
        run: ./scripts/ci/spike.ps1 -Phase Cleanup

      - name: Verdict
        shell: pwsh
        env:
          PROBE: ${{ steps.probe.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          SHADERS: ${{ steps.shaders.outcome }}
          RESEARCH: ${{ steps.research.outcome }}
        run: |
          "### Spike verdict`n- probe: $env:PROBE`n- capture tests: $env:CAPTURE`n- shader tests: $env:SHADERS`n- research tests: $env:RESEARCH" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ("$env:PROBE$env:CAPTURE$env:SHADERS$env:RESEARCH" -ne "successsuccesssuccesssuccess") { exit 1 }
