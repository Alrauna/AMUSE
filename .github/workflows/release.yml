name: Build Release

on: 
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the published release as a prerelease"
        type: boolean
        default: false

concurrency:
  group: "release"
  cancel-in-progress: false

# No cache restore and no cache save for any job in this workflow.
cache-mode: none

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    # Ensure that required repository variable has been created for the Package
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # The full EditMode run on the locked Editor and the locked vendor set.
  # The build job needs it, so a red run publishes nothing. Pull requests
  # run no Unity job, so this is the last automatic test before a release.
  # The unity-main Environment allows only main and holds the secrets.
  unity:
    needs: config
    if: needs.config.outputs.config_package == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    environment: unity-main
    permissions:
      contents: read
    # One license account serves the whole repository. Licensed jobs sign in
    # one after the other. A run that waits in the group stays in line and
    # runs in order, up to 100 waiting runs. If the queue is full, extra
    # runs are cancelled. A waiting run never cancels the running job.
    concurrency:
      group: unity-license
      cancel-in-progress: false
      queue: max
    steps:
      # Git for Windows turns LF into CRLF on checkout by default. Some
      # product tests hold verbatim multi-line strings and compare them with
      # LF text. The step must run before the checkout.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Unity
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/install-unity.ps1

      # This step copies the scripts to a folder that only administrators can
      # write. Every later step runs that copy, because the workspace may hold
      # code that ran as the low user.
      - name: Prepare the run as a low-privilege user
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci/prepare-run.ps1

      # Only this step sees the account secrets.
      - name: Activate the license
        timeout-minutes: 20
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: ${{ runner.temp }}/admin-scripts/license.ps1 -Action Activate

      - name: Install the vendor packages
        timeout-minutes: 30
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/install-packages.ps1 -Mode gate -ProjectPath ${{ github.workspace }}

      - name: Prepare the project for the low user
        timeout-minutes: 15
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/prepare-project.ps1

      - name: Probe the isolation of the low user
        timeout-minutes: 10
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/isolation-probe.ps1

      # The product step runs the real LAC pass gate on the locked vendor
      # set. AMUSE_REAL_THRY_LOCK, AMUSE_DAO_INTEGRATION, and
      # AMUSE_PRODUCTION_ORDER_DISPATCH stay canary only. The research
      # assembly holds no gated test, so its step passes no -OptIn.
      - name: Run the product tests
        timeout-minutes: 60
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/run-tests.ps1 -AsLowUser -Assembly Alrauna.Amuse.Tests.Editor -OptIn AMUSE_REAL_LAC_PASS -TimeoutMinutes 55

      - name: Run the research tests
        timeout-minutes: 60
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/run-tests.ps1 -AsLowUser -Assembly Alrauna.Amuse.Research.Tests.Editor -TimeoutMinutes 55

      # A cancelled run still frees the activation and cleans up when the
      # runner still runs the job. A hard kill or a lost runner can skip
      # this step.
      - name: Return the license
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/license.ps1 -Action Return

      - name: Clean up the low user and the license file
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: ${{ runner.temp }}/admin-scripts/cleanup.ps1

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped.
  # The unity job must pass first.
  build:
    needs: [config, unity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    if: needs.config.outputs.config_package == 'true'
    steps:

      # The release job publishes only from main. A dispatch from another
      # branch fails here. This guard replaced the release environment policy.
      - name: Refuse dispatch from a branch other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The release workflow dispatches only from main."
          echo "This run started on ${{ github.ref }}."
          exit 1

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@42c424cc2a0f9dfd36c79aedb70d429c0ae3e3fa
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Zip the Package for release, excluding the editor test assembly.
      # Tests/ exports synthetic NDMF plugins that must never reach consumers.
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" . -x "Tests/*" "Tests.meta"
      
      # Build a list of .meta files for future use, excluding the editor tests
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta -not -path "*/Tests/*" -not -path "*/Tests.meta" >> metaList
      
      # Fail the release if test content re-enters either artifact's contents
      - name: Verify Release Excludes Tests
        run: |
          if unzip -Z1 "${{ github.workspace }}/${{ env.zipFile }}" | grep -qE '(^|/)Tests(/|\.meta$)'; then
            echo "::error::Release zip contains test content"; exit 1;
          fi
          if grep -qE '(^|/)Tests(/|\.meta$)' metaList; then
            echo "::error::UnityPackage meta list contains test content"; exit 1;
          fi
          if ! unzip -Z1 "${{ github.workspace }}/${{ env.zipFile }}" | grep -q "^Editor/Alrauna.Amuse.Editor.asmdef$"; then
            echo "::error::Release zip is missing the production editor assembly"; exit 1;
          fi
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@b5c57408698b1fab8b3a84d4b67f767b8b7c0be9
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}
          prerelease: ${{ inputs.prerelease }}
