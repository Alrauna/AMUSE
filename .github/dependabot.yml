# Dependabot keeps the pinned GitHub Actions current. It covers the
# SHA-pinned actions/checkout in each workflow, the four pinned
# actions in release.yml, and the four pinned GitHub-owned actions
# in build-listing.yml.
# Dependabot runs get no Actions secrets. The unity job in pr.yml skips
# a Dependabot pull request. The scope job in pr.yml reads the changed
# paths. A change to allow-listed paths only, such as this file, needs
# no Unity run and passes. Any other change shows a red fork-notice
# job. The maintainer reads that change and pushes it again from a
# branch in this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
