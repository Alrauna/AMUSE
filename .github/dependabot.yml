# Dependabot keeps the pinned GitHub Actions current. It covers the
# SHA-pinned actions/checkout in each workflow, the four pinned
# actions in release.yml, and the four pinned GitHub-owned actions
# in build-listing.yml.
# Dependabot runs get no Actions secrets. Since 2026-11-20, pr.yml runs
# no Unity job and needs no secret, so a Dependabot pull request gets
# the same checks as any other pull request.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
